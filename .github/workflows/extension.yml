# Releases are the update channel for the Chrome extension.
#
# On every change to main, this builds the extension. When @version in
# tampermonkey.user.js is new, it creates GitHub release v<version> on that
# commit, with the extension zip attached. Every installed extension checks the
# latest release every few hours and switches to its userscript, so merging a
# version bump is all it takes to ship. A push without a bump builds as a check
# and releases nothing. PRs only build.
name: Chrome extension

on:
  push:
    branches: [main]
    paths:
      - tampermonkey.user.js
      - extension/**
      - .github/workflows/extension.yml
  pull_request:
    paths:
      - tampermonkey.user.js
      - extension/**
      - .github/workflows/extension.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: python3 extension/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: tealium-debugger-extension-${{ steps.build.outputs.shell }}
          path: dist/extension/

      - name: GitHub release (new @version only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ steps.build.outputs.script }}
          SHELL_V: ${{ steps.build.outputs.shell }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if gh release view "v$SCRIPT" >/dev/null 2>&1; then
            echo "v$SCRIPT is already released; bump @version to ship a new build."
            exit 0
          fi
          gh release create "v$SCRIPT" "$ZIP" \
            --title "v$SCRIPT" --target "$GITHUB_SHA" --latest \
            --notes "Debugger $SCRIPT, built from $GITHUB_SHA.

          - Chrome extension installs pick this up automatically within a few hours (or click the toolbar icon).
          - Tampermonkey installs update from the raw URL as before.
          - The attached zip is extension shell $SHELL_V. Only download it for a first install, or when the toolbar icon shows UPD."
